# Source: https://raw.githubusercontent.com/kubernetes-sigs/cluster-api-provider-azure/e8b9ce372d09fdf3e6b91300eec23715e1ad5a6f/templates/test/ci/prow-ci-version/patches/oot-credential-provider-kcp.yaml
# Keep this patch in sync with the upstream CAPZ prow-ci-version patch when updating.
- op: add
  path: /spec/kubeadmConfigSpec/files/-
  value:
    content: |
      #!/bin/bash

      set -o nounset
      set -o pipefail
      set -o errexit

      # Download the OOT credential provider artifacts from the CI storage account.
      # az CLI is not present on the control plane image and the storage account no
      # longer allows anonymous access, so authenticate directly against IMDS using the
      # node's user-assigned managed identity and pull the blobs with curl --fail.
      # The identity must have the "Storage Blob Data Reader" role on ${AZURE_STORAGE_ACCOUNT}.
      echo "Downloading OOT credential provider using managed identity via IMDS"
      mkdir -p /var/lib/kubelet/credential-provider

      imds_token=$(curl --retry 10 --retry-delay 5 --fail -sS -H "Metadata: true" \
        "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fstorage.azure.com%2F" \
        | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

      if [[ -z "$${imds_token}" ]]; then
        echo "ERROR: failed to obtain an IMDS access token for Azure Storage" >&2
        exit 1
      fi

      download_blob() {
        curl --retry 10 --retry-delay 5 --fail -sS \
          -H "Authorization: Bearer $${imds_token}" \
          -H "x-ms-version: 2019-12-12" \
          -o "$2" \
          "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_BLOB_CONTAINER_NAME}/${IMAGE_TAG_ACR_CREDENTIAL_PROVIDER}/$1"
      }

      download_blob "azure-acr-credential-provider" /var/lib/kubelet/credential-provider/acr-credential-provider
      chmod 755 /var/lib/kubelet/credential-provider/acr-credential-provider

      download_blob "credential-provider-config.yaml" /var/lib/kubelet/credential-provider-config.yaml
      chmod 644 /var/lib/kubelet/credential-provider-config.yaml
    path: /tmp/oot-cred-provider.sh
    owner: "root:root"
    permissions: "0744"
- op: add
  path: /spec/kubeadmConfigSpec/preKubeadmCommands/-
  value:
    bash -c /tmp/oot-cred-provider.sh
- op: add
  path: /spec/kubeadmConfigSpec/initConfiguration/nodeRegistration/kubeletExtraArgs/image-credential-provider-bin-dir
  value:
    /var/lib/kubelet/credential-provider
- op: add
  path: /spec/kubeadmConfigSpec/initConfiguration/nodeRegistration/kubeletExtraArgs/image-credential-provider-config
  value:
    /var/lib/kubelet/credential-provider-config.yaml
- op: add
  path: /spec/kubeadmConfigSpec/joinConfiguration/nodeRegistration/kubeletExtraArgs/image-credential-provider-bin-dir
  value:
    /var/lib/kubelet/credential-provider
- op: add
  path: /spec/kubeadmConfigSpec/joinConfiguration/nodeRegistration/kubeletExtraArgs/image-credential-provider-config
  value:
    /var/lib/kubelet/credential-provider-config.yaml