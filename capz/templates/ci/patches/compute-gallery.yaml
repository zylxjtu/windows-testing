apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  annotations:
    runtime: containerd
  name: ${CLUSTER_NAME}-md-win
  namespace: default
spec:
  template:
    spec:
      disableVMBootstrapExtension: true
      image:
        computeGallery:
          subscriptionID: "${WINDOWS_GALLERY_SUBSCRIPTION_ID}"
          resourceGroup: "${WINDOWS_GALLERY_RESOURCE_GROUP}"
          gallery: "${WINDOWS_GALLERY_NAME}"
          name: "${WINDOWS_GALLERY_IMAGE_NAME}"
          version: "${WINDOWS_GALLERY_IMAGE_VERSION}"
