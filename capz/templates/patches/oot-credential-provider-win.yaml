# Source: https://raw.githubusercontent.com/kubernetes-sigs/cluster-api-provider-azure/e8b9ce372d09fdf3e6b91300eec23715e1ad5a6f/templates/test/ci/prow-ci-version/patches/oot-credential-provider-win.yaml
# Keep this patch in sync with the upstream CAPZ prow-ci-version patch when updating.
- op: add
  path: /spec/template/spec/files/-
  value:
    content: |
      $ErrorActionPreference = 'Stop'

      $$identityResourceId='${USER_IDENTITY}'
      if ($$identityResourceId -eq '') {
        throw 'USER_IDENTITY must identify the worker managed identity.'
      }

      $$tokenUri='http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fstorage.azure.com%2F&mi_res_id=' + [uri]::EscapeDataString($$identityResourceId)
      $$accessToken=(Invoke-RestMethod -Headers @{Metadata='true'} -Uri $$tokenUri).access_token
      if ($$accessToken -eq '') {
        throw 'Unable to acquire a Storage access token from IMDS.'
      }

      function Download-PrivateBlob($$uri, $$destination) {
        curl.exe --fail --retry 10 --retry-delay 5 -L $$uri `
          -H "Authorization: Bearer $$accessToken" `
          -H 'x-ms-version: 2023-11-03' `
          --output $$destination
        if ($$LASTEXITCODE -ne 0) {
          throw "Failed to download $$uri."
        }
      }

      mkdir C:\var\lib\kubelet\credential-provider
      $$artifactBaseUri="https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_BLOB_CONTAINER_NAME}/${IMAGE_TAG_ACR_CREDENTIAL_PROVIDER}"
      Download-PrivateBlob "$$artifactBaseUri/azure-acr-credential-provider.exe" C:\var\lib\kubelet\credential-provider\acr-credential-provider
      cp C:\var\lib\kubelet\credential-provider\acr-credential-provider C:\var\lib\kubelet\credential-provider\acr-credential-provider.exe
      Download-PrivateBlob "$$artifactBaseUri/credential-provider-config.yaml" C:\var\lib\kubelet\credential-provider-config.yaml
    path: C:/oot-cred-provider.ps1
    permissions: "0744"
- op: add
  path: /spec/template/spec/preKubeadmCommands/-
  value:
    powershell C:/oot-cred-provider.ps1
- op: add
  path: /spec/template/spec/joinConfiguration/nodeRegistration/kubeletExtraArgs/image-credential-provider-bin-dir
  value:
    /var/lib/kubelet/credential-provider
- op: add
  path: /spec/template/spec/joinConfiguration/nodeRegistration/kubeletExtraArgs/image-credential-provider-config
  value:
    /var/lib/kubelet/credential-provider-config.yaml