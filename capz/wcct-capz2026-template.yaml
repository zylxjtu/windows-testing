apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: wcct-capz2026-md-win
  namespace: default
spec:
  template:
    spec:
      files:
      - contentFrom:
          secret:
            key: worker-node-azure.json
            name: wcct-capz2026-md-win-azure-json
        owner: root:root
        path: c:/k/azure.json
        permissions: "0644"
      - content: |-
          Add-MpPreference -ExclusionProcess C:/opt/cni/bin/calico.exe
          Add-MpPreference -ExclusionProcess C:/opt/cni/bin/calico-ipam.exe
        path: C:/defender-exclude-calico.ps1
        permissions: "0744"
      - content: |
          # /tmp is assumed created and required for upstream e2e tests to pass
          New-Item -ItemType Directory -Force -Path C:\tmp\
        path: C:/create-temp-folder.ps1
        permissions: "0744"
      - content: |
          $ErrorActionPreference = 'Stop'
          $CONTAINERD_URL="https://wcctagentbakerstorage.blob.core.windows.net/arm64/containerd-2.3.3-windows-arm64.tar.gz"
          if($CONTAINERD_URL -ne ""){
            # Kubelet service depends on contianerd service so make a best effort attempt to stop it
            Stop-Service kubelet -Force -ErrorAction SilentlyContinue
            Stop-Service containerd -Force
            echo "downloading containerd: $CONTAINERD_URL"
            # If the URL is set to "latest", we will query the GitHub API for the latest containerd release
            if ($CONTAINERD_URL.ToLower() -eq "latest") {
              # Query GitHub API for latest containerd release for Windows
              $githubApiUrl = "https://api.github.com/repos/containerd/containerd/releases/latest"
              Write-Output "Fetching latest containerd release from GitHub..."
              $releaseInfo = Invoke-RestMethod -Uri $githubApiUrl -UseBasicParsing
              $asset = $releaseInfo.assets | Where-Object { $_.name -like "*windows-amd64.tar.gz" } | Select-Object -First 1
              if ($null -eq $asset) {
                Write-Output "Could not find a Windows containerd release asset in the latest GitHub release."
                exit 1
              }
              $CONTAINERD_URL = $asset.browser_download_url
            }
            curl.exe --retry 10 --retry-delay 5 -L "$CONTAINERD_URL" --output "c:/k/containerd.tar.gz"
            # Log service state and if any files under containerd director are locked
            Get-Service -Name containerd, kubelet
            $dir = "c:/Program Files/containerd"
            $files = Get-ChildItem $dir -Recurse
            Write-Output "Checking if any files under $dir are locked"
            foreach ($file in $files) {
                $f = $file.FullName
                Write-output "$f"
                $fi = New-Object System.IO.FileInfo $f
                try {
                    $fStream = $fi.Open([System.IO.FileMode]::Open, [System.IO.FileAccess]::ReadWrite, [System.IO.FileShare]::None)
                    if ($fStream) {
                        $fStream.Close()
                    }
                } catch {
                    Write-Output "Unable to open file: $f"
                }
            }
            Write-Output "Extracting new containerd binaries"
            tar.exe -zxvf c:/k/containerd.tar.gz -C "c:/Program Files/containerd" --strip-components 1
            # Recreate containerd service with native file logging
            Write-Output "Recreating containerd service with native file logging..."
            $logPath = "\var\log\containerd"
            if (-Not (Test-Path -Path $logPath -PathType Container)) {
              Write-Host "Creating log directory: $logPath"
              New-Item -ItemType Directory -Path $logPath -Force | Out-Null
            } else {
              Write-Host "Log directory already exists: $logPath"
            }
            $ContainerdCommandLine = '"c:\Program Files\containerd\containerd.exe" --register-service --log-file=c:\var\log\containerd\containerd.log'
            Write-Output "Containerd command line: $ContainerdCommandLine"
            # Stop and delete the existing containerd service
            Stop-Service -Name 'containerd' -Force -ErrorAction SilentlyContinue
            $null = sc.exe delete containerd
            # Wait for service to be fully deleted
            $serviceCreated = $false
            for ($i = 0; $i -lt 20; $i++) {
                $service = Get-Service -Name containerd -ErrorAction SilentlyContinue
                if ($null -eq $service) {
                    Write-Host "containerd service deleted successfully, recreating with native file logging"
                    cmd.exe /c $ContainerdCommandLine
                    Start-Service Containerd
                    Write-Output "Successfully started containerd service with native file logging"
                    $serviceCreated = $true
                    break
                }
                else {
                    Write-Host "Waiting for containerd service to be fully deleted... (attempt $($i + 1)/20)"
                }
                Start-Sleep -Seconds 1
            }
            if (-not $serviceCreated) {
                Write-Error "Failed to delete containerd service after 20 attempts"
            }
          }
          # Ensure sandbox_image includes Server 2025 variant for Hyper-V compatibility.
          # pause:3.10 and 3.10.1 lack a Server 2025 manifest, causing Hyper-V UVMs to boot as
          # Server 2022. containerd then selects the Server 2025 app image variant (based on host OS),
          # resulting in HCS_E_IMAGE_MISMATCH when mounting 2025 layers inside a 2022 UVM.
          # pause:3.10.2 includes Server 2025 and is backward-compatible with 2022.
          if ("" -eq "true") {
            $configPath = "C:\Program Files\containerd\config.toml"
            $configContent = [System.IO.File]::ReadAllText($configPath)
            $updated = $false
            # Config v2 format (containerd 1.x style): sandbox_image = "registry.k8s.io/pause:X.Y.Z"
            if ($configContent -match 'sandbox_image\s*=\s*"registry\.k8s\.io/pause:3\.10(\.1)?"') {
              $configContent = $configContent -replace 'sandbox_image\s*=\s*"registry\.k8s\.io/pause:3\.10(\.1)?"', 'sandbox_image = "registry.k8s.io/pause:3.10.2"'
              $updated = $true
            }
            # Config v3 format (containerd 2.x style): sandbox = 'registry.k8s.io/pause:X.Y.Z'
            if ($configContent -match "sandbox\s*=\s*'registry\.k8s\.io/pause:3\.10(\.1)?'") {
              $configContent = $configContent -replace "sandbox\s*=\s*'registry\.k8s\.io/pause:3\.10(\.1)?'", "sandbox = 'registry.k8s.io/pause:3.10.2'"
              $updated = $true
            }
            if ($updated) {
              [System.IO.File]::WriteAllText($configPath, $configContent)
              Write-Output "Updated sandbox image to pause:3.10.2 for Server 2025 Hyper-V compatibility"
              # Restart containerd so it picks up the new config and re-pins pause:3.10.2
              # Note: kubelet is not running yet (this is a preKubeadmCommands script)
              Restart-Service containerd
              # Pre-pull pause:3.10.2 so containerd can use it for sandboxes immediately
              Write-Output "Pre-pulling pause:3.10.2..."
              ctr.exe -n k8s.io images pull registry.k8s.io/pause:3.10.2
              Write-Output "Restarted containerd with new sandbox image"
            }
          }
          containerd.exe --version
          containerd-shim-runhcs-v1.exe --version
        path: C:/replace-containerd.ps1
        permissions: "0744"
      - content: |
          $ErrorActionPreference = "Stop"
          $FileContent = Get-Content -Path "$env:SYSTEMDRIVE/var/lib/kubelet/kubeadm-flags.env"
          $kubeAdmArgs = $FileContent.TrimStart('KUBELET_KUBEADM_ARGS=').Trim('"')

          # Set the path to your kubelet config file
          $configFile = "$env:SYSTEMDRIVE/var/lib/kubelet/config.yaml"
          $content = Get-Content -Path $configFile
          # Check if NodeLogQuery feature gate was specified for the cluster and if so, also enable it via kubelet config
          if ($kubeAdmArgs.Contains("NodeLogQuery=true")) {
              $content += "enableSystemLogQuery: true"
          }
          if ($kubeAdmArgs.Contains("WindowsGracefulNodeShutdown=true")) {
            # Remove existing lines that match the settings
            $content = $content | Where-Object { $_ -notmatch "^shutdownGracePeriod:" -and $_ -notmatch "^shutdownGracePeriodCriticalPods:" }
            # Append new values at the end
            $content += "shutdownGracePeriod: 1m"
            $content += "shutdownGracePeriodCriticalPods: 20s"
          }
          # Override kubelet maxPods when MAX_PODS is set (envsubst at apply time).
          if ("" -ne "") {
            $content = $content | Where-Object { $_ -notmatch "^maxPods:" }
            $content += "maxPods: "
          }

          # Write the updated content back to the file
          $content | Set-Content -Path $configFile -Encoding ascii
        path: C:/updateKubeletConfig.ps1
        permissions: "0744"
      - content: |
          # This script restarts the kubelet service.
          # It supports both nssm and Windows service configurations,
          # ensuring a smooth transition between service managers without interruption.
          # This script will eventually be removed once nssm is no longer used.
          $scriptPath = "$env:SYSTEMDRIVE/k/RestartKubelet.ps1"
          if (Test-Path $scriptPath) {
              Write-Host "Found RestartKubelet.ps1, executing..."
              & $scriptPath
          } else {
              Write-Host "RestartKubelet.ps1 not found. Running fallback command..."
              & "$env:SYSTEMDRIVE\k\nssm.exe" set kubelet start SERVICE_AUTO_START
              # Actually restart the running kubelet so config.yaml changes take effect.
              & "$env:SYSTEMDRIVE\k\nssm.exe" restart kubelet
          }
        path: C:/KubeletRestart_nssm_sc.ps1
        permissions: "0744"
      - content: |
          mkdir -Force c:/localdumps
          reg.exe add "HKLM\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps" /V DumpCount /t REG_DWORD /d 50 /f
          reg.exe add "HKLM\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps" /V DumpType /t REG_DWORD /d 2 /f
          reg.exe add "HKLM\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps" /V DumpFolder /t REG_EXPAND_SZ /d "c:/LocalDumps" /f
          # Enable sftp so we can copy crash dump files during log collection of stfp
          $sshd_config = "$env:ProgramData\ssh\sshd_config"
          if (-not (Test-Path $sshd_config)) { mkdir -Force $sshd_config }
          Add-Content -Path $sshd_config "Subsystem sftp              sftp-server.exe"
          sc.exe stop sshd
          sc.exe start sshd
        path: C:/collect-hns-crashes.ps1
        permissions: "0744"
      - content: |
          ssh-rsa  azureuser@yuanlianglinux
        owner: root:root
        path: C:/ProgramData/ssh/administrators_authorized_keys
        permissions: "0640"
      - content: |
          $ErrorActionPreference = 'Continue'
          $scriptUrl = 'https://raw.githubusercontent.com/kubernetes-sigs/windows-testing/master/scripts/install-registry-structure.ps1'
          $scriptPath = 'C:/install-registry-structure.ps1'
          Write-Host "Downloading install-registry-structure.ps1 from GitHub..."
          curl.exe -sL $scriptUrl -o $scriptPath
          if (-not (Test-Path $scriptPath)) {
              Write-Error "Failed to download script from $scriptUrl"
              exit 1
          }
          Write-Host "Running install-registry-structure.ps1..."
          & $scriptPath
        path: C:/setup-registry-structure.ps1
        permissions: "0744"
      - content: |
          $ErrorActionPreference = 'Stop'

          Stop-Service kubelet -Force

          $CI_VERSION="v1.35.7-10+7fad80f1cca5e0"
          if($CI_VERSION -ne "")
          {
            $binaries=@("kubeadm", "kubectl", "kubelet", "kube-proxy")
            $ci_url="https://wcctagentbakerstorage.blob.core.windows.net/arm64"
            if ($ci_url -eq "") {
              Write-Error "WINDOWS_KUBERNETES_BIN_URL must contain Windows ARM64 Kubernetes binaries"
              exit 1
            }
            foreach ( $binary in $binaries )
            {
              echo "downloading binary: $ci_url/$binary.exe"
              curl.exe --retry 10 --retry-delay 5 "$ci_url/$binary.exe" --output "c:/k/$binary.exe"
            }
          }

          # Tag the ARM64 image under the tag CAPZ's kube-proxy manifest expects.
          ctr.exe -n k8s.io images pull --local wcctpublic.azurecr.io/kube-proxy:windows-arm64
          ctr.exe -n k8s.io images tag wcctpublic.azurecr.io/kube-proxy:windows-arm64 "docker.io/sigwindowstools/kube-proxy:v1.35.7-10_7fad80f1cca5e0-calico-hostprocess"

          echo "kubeadm version: "
          kubeadm.exe version -o=short
          echo "kubectl version: "
          kubectl.exe version --client=true
          echo "kubelet version: "
          kubelet.exe --version
          echo "kube-proxy version: "
          kube-proxy.exe --version
        path: C:/replace-ci-binaries.ps1
        permissions: "0744"
      - content: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Attempting to log in to Azure with managed identity"
          az login --identity > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Logged in Azure with managed identity"
            Write-Host "Use OOT credential provider"
            mkdir C:\var\lib\kubelet\credential-provider
            az storage blob download --blob-url "https://wcctagentbakerstorage.blob.core.windows.net/kubernetes-ci/979ee59/azure-acr-credential-provider.exe" -f C:\var\lib\kubelet\credential-provider\acr-credential-provider --auth-mode login
            cp C:\var\lib\kubelet\credential-provider\acr-credential-provider C:\var\lib\kubelet\credential-provider\acr-credential-provider.exe
            az storage blob download --blob-url "https://wcctagentbakerstorage.blob.core.windows.net/kubernetes-ci/979ee59/credential-provider-config.yaml" -f C:\var\lib\kubelet\credential-provider-config.yaml --auth-mode login
          } else {
            Write-Host "Using curl to download the OOT credential provider"
            mkdir C:\var\lib\kubelet\credential-provider
            curl.exe --retry 10 --retry-delay 5 -L "https://wcctagentbakerstorage.blob.core.windows.net/kubernetes-ci/979ee59/azure-acr-credential-provider.exe" --output C:\var\lib\kubelet\credential-provider\acr-credential-provider
            cp C:\var\lib\kubelet\credential-provider\acr-credential-provider C:\var\lib\kubelet\credential-provider\acr-credential-provider.exe
            curl.exe --retry 10 --retry-delay 5 -L "https://wcctagentbakerstorage.blob.core.windows.net/kubernetes-ci/979ee59/credential-provider-config.yaml" --output C:\var\lib\kubelet\credential-provider-config.yaml
          }
        path: C:/oot-cred-provider.ps1
        permissions: "0744"
      joinConfiguration:
        nodeRegistration:
          criSocket: npipe:////./pipe/containerd-containerd
          kubeletExtraArgs:
            cloud-provider: external
            feature-gates: WindowsGracefulNodeShutdown=true
            image-credential-provider-bin-dir: /var/lib/kubelet/credential-provider
            image-credential-provider-config: /var/lib/kubelet/credential-provider-config.yaml
            v: "2"
            windows-priorityclass: ABOVE_NORMAL_PRIORITY_CLASS
          name: '{{ ds.meta_data["local_hostname"] }}'
      postKubeadmCommands:
      - powershell C:/updateKubeletConfig.ps1
      - powershell C:/KubeletRestart_nssm_sc.ps1
      - powershell C:/defender-exclude-calico.ps1
      - powershell C:/setup-registry-structure.ps1
      preKubeadmCommands:
      - powershell C:/create-temp-folder.ps1
      - powershell C:/replace-containerd.ps1
      - powershell C:/collect-hns-crashes.ps1
      - powershell C:/replace-ci-binaries.ps1
      - powershell C:/oot-cred-provider.ps1
      users:
      - groups: Administrators
        name: capi
        sshAuthorizedKeys:
        - ssh-rsa 
          azureuser@yuanlianglinux
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  labels:
    cni: wcct-capz2026-calico
    containerd-logger: enabled
    metrics-server: enabled
  name: wcct-capz2026
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: wcct-capz2026-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AzureCluster
    name: wcct-capz2026
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: wcct-capz2026-md-win
  namespace: default
spec:
  clusterName: wcct-capz2026
  replicas: 2
  selector: {}
  template:
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: wcct-capz2026-md-win
      clusterName: wcct-capz2026
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureMachineTemplate
        name: wcct-capz2026-md-win
      version: v1.35.7-10+7fad80f1cca5e0
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: wcct-capz2026-control-plane
  namespace: default
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        extraArgs:
          feature-gates: ""
        timeoutForControlPlane: 20m
      controllerManager:
        extraArgs:
          allocate-node-cidrs: "false"
          cloud-provider: external
          cluster-name: wcct-capz2026
          v: "4"
      etcd:
        local:
          dataDir: /var/lib/etcddisk/etcd
          extraArgs:
            quota-backend-bytes: "8589934592"
      kubernetesVersion: ci/v1.35.7-10+7fad80f1cca5e0
      scheduler:
        extraArgs:
          feature-gates: ""
    diskSetup:
      filesystems:
      - device: /dev/disk/azure/scsi1/lun0
        extraOpts:
        - -E
        - lazy_itable_init=1,lazy_journal_init=1
        filesystem: ext4
        label: etcd_disk
      - device: ephemeral0.1
        filesystem: ext4
        label: ephemeral0
        replaceFS: ntfs
      partitions:
      - device: /dev/disk/azure/scsi1/lun0
        layout: true
        overwrite: false
        tableType: gpt
    files:
    - contentFrom:
        secret:
          key: control-plane-azure.json
          name: wcct-capz2026-control-plane-azure-json
      owner: root:root
      path: /etc/kubernetes/azure.json
      permissions: "0644"
    - content: |
        #!/bin/bash
        set -o nounset
        set -o pipefail
        set -o errexit
        if grep -q "NodeLogQuery=true" /var/lib/kubelet/kubeadm-flags.env; then
          [[ $(id -u) != 0 ]] && SUDO="sudo" || SUDO=""
          echo "* adding enableSystemLogQuery: true to kubelet config"
          printf "enableSystemLogQuery: true\n" | ${SUDO} tee --append /var/lib/kubelet/config.yaml
          ${SUDO} systemctl restart kubelet
        fi
      owner: root:root
      path: /tmp/node-log-query-kubelet-config.sh
      permissions: "0744"
    - content: |
        #!/bin/bash
        set -o nounset
        set -o pipefail
        set -o errexit
        [[ $(id -u) != 0 ]] && SUDO="sudo" || SUDO=""
        # This test installs release packages or binaries that are a result of the CI and release builds.
        # It runs '... --version' commands to verify that the binaries are correctly installed
        # and finally uninstalls the packages.
        # For the release packages it tests all versions in the support skew.
        LINE_SEPARATOR="*************************************************"
        echo "$LINE_SEPARATOR"
        CI_VERSION=v1.35.7-10+7fad80f1cca5e0
        if [[ "${CI_VERSION}" != "" ]]; then
          CI_DIR=/tmp/k8s-ci
          mkdir -p $CI_DIR
          declare -a PACKAGES_TO_TEST=("kubectl" "kubelet" "kubeadm")
          declare -a CONTAINERS_TO_TEST=("kube-apiserver" "kube-controller-manager" "kube-proxy" "kube-scheduler")
          CONTAINER_EXT="tar"
          echo "* testing CI version $CI_VERSION"
          # Check for semver
          if [[ "${CI_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION_WITHOUT_PREFIX="1.35.7-10+7fad80f1cca5e0"
            DEBIAN_FRONTEND=noninteractive apt-get install -y apt-transport-https curl
            curl -s https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key add -
            echo 'deb https://apt.kubernetes.io/ kubernetes-xenial main' > /etc/apt/sources.list.d/kubernetes.list
            apt-get update
            # replace . with \.
            VERSION_REGEX=""
            PACKAGE_VERSION="$(apt-cache madison kubelet|grep ${VERSION_REGEX}- | head -n1 | cut -d '|' -f 2 | tr -d '[:space:]')"
            for CI_PACKAGE in "${PACKAGES_TO_TEST[@]}"; do
              echo "* installing package: $CI_PACKAGE ${PACKAGE_VERSION}"
              DEBIAN_FRONTEND=noninteractive apt-get install -y $CI_PACKAGE=$PACKAGE_VERSION
            done
          else
            CI_URL="https://storage.googleapis.com/k8s-release-dev/ci/${CI_VERSION}/bin/linux/amd64"
            for CI_PACKAGE in "${PACKAGES_TO_TEST[@]}"; do
              echo "* downloading binary: $CI_URL/$CI_PACKAGE"
              wget "$CI_URL/$CI_PACKAGE" -nv -O "$CI_DIR/$CI_PACKAGE"
              chmod +x "$CI_DIR/$CI_PACKAGE"
              mv "$CI_DIR/$CI_PACKAGE" "/usr/bin/$CI_PACKAGE"
            done
            IMAGE_REGISTRY_PREFIX=registry.k8s.io
            for CI_CONTAINER in "${CONTAINERS_TO_TEST[@]}"; do
              echo "* downloading package: $CI_URL/$CI_CONTAINER.$CONTAINER_EXT"
              wget "$CI_URL/$CI_CONTAINER.$CONTAINER_EXT" -nv -O "$CI_DIR/$CI_CONTAINER.$CONTAINER_EXT"
              ${SUDO} ctr -n k8s.io images import "$CI_DIR/$CI_CONTAINER.$CONTAINER_EXT" || echo "* ignoring expected 'ctr images import' result"
              ${SUDO} ctr -n k8s.io images tag $IMAGE_REGISTRY_PREFIX/$CI_CONTAINER-amd64:"${CI_VERSION//+/_}" $IMAGE_REGISTRY_PREFIX/$CI_CONTAINER:"${CI_VERSION//+/_}"
              ${SUDO} ctr -n k8s.io images tag $IMAGE_REGISTRY_PREFIX/$CI_CONTAINER-amd64:"${CI_VERSION//+/_}" gcr.io/k8s-staging-ci-images/$CI_CONTAINER:"${CI_VERSION//+/_}"
            done
          fi
          systemctl restart kubelet
        fi
        echo "* checking binary versions"
        echo "ctr version: " $(ctr version)
        echo "kubeadm version: " $(kubeadm version -o=short)
        echo "kubectl version: " $(kubectl version --client=true)
        echo "kubelet version: " $(kubelet --version)
        echo "$LINE_SEPARATOR"
      owner: root:root
      path: /tmp/kubeadm-bootstrap.sh
      permissions: "0744"
    - content: |
        #!/bin/bash

        set -o nounset
        set -o pipefail
        set -o errexit

        # Download the OOT credential provider artifacts from the CI storage account.
        # az CLI is not present on the control plane image and the storage account no
        # longer allows anonymous access, so authenticate directly against IMDS using the
        # node's user-assigned managed identity and pull the blobs with curl --fail.
        # The identity must have the "Storage Blob Data Reader" role on wcctagentbakerstorage.
        echo "Downloading OOT credential provider using managed identity via IMDS"
        mkdir -p /var/lib/kubelet/credential-provider

        imds_token=$(curl --retry 10 --retry-delay 5 --fail -sS -H "Metadata: true" \
          "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fstorage.azure.com%2F" \
          | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

        if [[ -z "${imds_token}" ]]; then
          echo "ERROR: failed to obtain an IMDS access token for Azure Storage" >&2
          exit 1
        fi

        download_blob() {
          curl --retry 10 --retry-delay 5 --fail -sS \
            -H "Authorization: Bearer ${imds_token}" \
            -H "x-ms-version: 2019-12-12" \
            -o "$2" \
            "https://wcctagentbakerstorage.blob.core.windows.net/kubernetes-ci/979ee59/$1"
        }

        download_blob "azure-acr-credential-provider" /var/lib/kubelet/credential-provider/acr-credential-provider
        chmod 755 /var/lib/kubelet/credential-provider/acr-credential-provider

        download_blob "credential-provider-config.yaml" /var/lib/kubelet/credential-provider-config.yaml
        chmod 644 /var/lib/kubelet/credential-provider-config.yaml
      owner: root:root
      path: /tmp/oot-cred-provider.sh
      permissions: "0744"
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
          feature-gates: WindowsGracefulNodeShutdown=true
          image-credential-provider-bin-dir: /var/lib/kubelet/credential-provider
